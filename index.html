<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advenature - Loot Box Tinh Quang</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- Google Identity Services SDK -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <!-- QRCode Lib (Dùng cho QR túi đồ offline) -->
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

    <!-- Importmap cho Three.js -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>
</head>
<body>

    <!-- 1. KHUNG CHỨA TOÀN BỘ GAME & GACHA 3D THEO MẪU MỚI -->
    <div id="game-container">
        <!-- Nền 3D Canvas -->
        <div id="app-3d"></div>

        <!-- TOP STATUS BAR -->
        <header class="rpg-topbar">
            <div class="brand-logo">ADVENATURE</div>
            
            <div class="currency-group">
                <div class="currency-pill">
                    <span class="curr-label">Điểm Tinh Quang</span>
                    <span class="curr-val">⭐ <span id="valTinhQuang">12,450</span></span>
                </div>
                <div class="currency-pill">
                    <span class="curr-label">Tinh Thạch</span>
                    <span class="curr-val">💎 <span id="valTinhThach">380</span></span>
                </div>
            </div>

            <div class="user-avatar-frame" id="btnProfileQuick">
                <img src="https://i.ibb.co/3k5f3Kz/avatar-default.png" alt="Avatar" id="userAvatarImg" class="avatar-img">
                <div class="level-badge">Lv. 42</div>
                <span class="player-name" id="userDisplayName">Kael</span>
            </div>
        </header>

        <!-- SUB TITLE -->
        <div class="tab-indicator">Home Gacha</div>

        <!-- MÀN HÌNH 1: GACHA VIEW (Bệ đá & nút Triệu Hồi) -->
        <main id="gacha-view" class="view-panel active">
            <div class="crystal-title-box">
                <span class="crystal-icon">🔮</span>
                <span class="crystal-name" id="crystalNameHeader">Magic Crystal</span>
            </div>

            <div id="lootText"></div>

            <div class="summon-zone">
                <button id="gachaButton" class="btn-summon">
                    <span class="summon-icon">🔮</span>
                    <span class="summon-text">TRIỆU HỒI (1x)</span>
                    <span class="summon-cost">💎 300</span>
                </button>
                
                <div id="claimContainer" class="hidden">
                    <button id="claimButton" class="btn-claim">✦ THU THẬP VÀO TÚI ✦</button>
                </div>
            </div>
        </main>

        <!-- BOTTOM ARC WHEEL DOCK (Thanh điều hướng dưới đáy) -->
        <footer class="rpg-dock">
            <button class="dock-btn sub-left nav-btn" data-target="quest-view">
                <div class="dock-icon-ring ring-secondary">
                    <span class="dock-ico">📜</span>
                    <span class="badge-dot"></span>
                </div>
                <span class="dock-label">Nhiệm Vụ</span>
                <span class="dock-sub">3 Active</span>
            </button>

            <button class="dock-btn mid-left nav-btn" data-target="inventory-view">
                <div class="dock-icon-ring ring-primary">
                    <span class="dock-ico">🎒</span>
                </div>
                <span class="dock-label">Túi Đồ</span>
                <span class="dock-sub">158 Items</span>
            </button>

            <button class="dock-btn center-core nav-btn active" data-target="gacha-view">
                <div class="core-glow-ring">
                    <div class="core-inner-sphere">
                        <span class="core-ico">🔮</span>
                        <span class="core-text">GACHA</span>
                    </div>
                </div>
            </button>

            <button class="dock-btn mid-right nav-btn" data-target="shop-view">
                <div class="dock-icon-ring ring-primary">
                    <span class="dock-ico">🛒</span>
                    <span class="badge-count">7</span>
                </div>
                <span class="dock-label">Shop</span>
                <span class="dock-sub">7 Offers</span>
            </button>

            <button class="dock-btn sub-right nav-btn" data-target="profile-view">
                <div class="dock-icon-ring ring-secondary">
                    <span class="dock-ico">🛡️</span>
                    <span class="badge-dot"></span>
                </div>
                <span class="dock-label">Nhà Phiêu Lưu</span>
                <span class="dock-sub">Stats</span>
            </button>
        </footer>
    </div>

    <!-- 2. MÀN HÌNH 2: TÚI TRỮ VẬT (GIỮ LẠI - NẰM NGOÀI GAME CONTAINER ĐỂ LÀM POPUP/LAYER) -->
    <section id="inventory-view" class="view-panel hidden">
        <div class="panel-container">
            <span class="close-panel-btn" onclick="document.getElementById('inventory-view').classList.add('hidden')">&times;</span>
            <h2 class="section-title">🎒 TÚI TRỮ VẬT NHÀ PHIÊU LƯU</h2>
            <div class="inv-tabs">
                <button class="inv-tab-btn active" data-sub="sub-gems">Tinh Quang Thạch (<span id="gemProgress">0/990</span>)</button>
                <button class="inv-tab-btn" data-sub="sub-items">Vật Phẩm & Thẻ (5x5)</button>
            </div>

            <!-- Tab Con 1: Tủ 990 Tinh Quang Thạch -->
            <div id="sub-gems" class="inv-content active">
                <div class="progress-bar-container">
                    <div id="gemProgressBar" class="progress-fill" style="width: 0%;"></div>
                </div>
                <div id="gemGrid" class="gem-grid-layout"></div>
            </div>

            <!-- Tab Con 2: Lưới 5x5 Vật Phẩm Offline -->
            <div id="sub-items" class="inv-content hidden">
                <div id="itemGrid" class="grid-5x5"></div>
            </div>
        </div>
    </section>

    <!-- 3. MODAL QR OFFLINE (GIỮ LẠI) -->
    <div id="itemModal" class="modal-overlay hidden">
        <div class="modal-box">
            <span class="close-modal" id="closeItemModal">&times;</span>
            <h3 id="modalItemTitle">Tên Vật Phẩm</h3>
            <p id="modalItemDesc">Mô tả vật phẩm...</p>
            <div id="qrcode" class="qr-box"></div>
            <p class="qr-note">Đưa mã này cho NPC / Quản lý Hội Ngọc Lục để sử dụng</p>
        </div>
    </div>

    <!-- Import logic JS -->
    <script type="module" src="app.js"></script>
</body>
</html>
